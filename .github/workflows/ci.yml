name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI / PowerShell ${{ matrix.ps-version }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - ps-version: '5.1'
            shell: powershell

          - ps-version: '7'
            shell: pwsh

    steps:
      # ──────────────────────────────────────────────────────────────────────
      # Checkout
      # ──────────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────────────────────────────
      # Environment
      # ──────────────────────────────────────────────────────────────────────
      - name: Show environment
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "PowerShell version:"
          $PSVersionTable | Format-List

          Write-Host "Working directory:"
          Get-Location

      # ──────────────────────────────────────────────────────────────────────
      # Install Pester
      # ──────────────────────────────────────────────────────────────────────
      - name: Install Pester
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'

          Set-PSRepository `
            -Name 'PSGallery' `
            -InstallationPolicy 'Trusted'

          $pester = Get-Module -Name 'Pester' -ListAvailable |
            Where-Object { $_.Version -ge [version]'5.0.0' } |
            Sort-Object Version -Descending |
            Select-Object -First 1

          if (-not $pester) {
            Write-Host 'Installing Pester 5+...'

            Install-Module `
              -Name 'Pester' `
              -MinimumVersion '5.0.0' `
              -Scope 'CurrentUser' `
              -Force `
              -SkipPublisherCheck `
              -AllowClobber
          }
          else {
            Write-Host "Pester $($pester.Version) already available."
          }

          Import-Module Pester -MinimumVersion 5.0.0 -Force

          Write-Host 'Installed Pester versions:'
          Get-Module -Name Pester -ListAvailable |
            Sort-Object Version -Descending |
            Select-Object Name, Version, Path |
            Format-Table -AutoSize

      # ──────────────────────────────────────────────────────────────────────
      # Install PSScriptAnalyzer
      # ──────────────────────────────────────────────────────────────────────
      - name: Install PSScriptAnalyzer
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'

          Set-PSRepository `
            -Name 'PSGallery' `
            -InstallationPolicy 'Trusted'

          $analyzer = Get-Module -Name 'PSScriptAnalyzer' -ListAvailable |
            Sort-Object Version -Descending |
            Select-Object -First 1

          if (-not $analyzer) {
            Write-Host 'Installing PSScriptAnalyzer...'

            Install-Module `
              -Name 'PSScriptAnalyzer' `
              -Scope 'CurrentUser' `
              -Force `
              -AllowClobber
          }
          else {
            Write-Host "PSScriptAnalyzer $($analyzer.Version) already available."
          }

          Import-Module PSScriptAnalyzer -Force

          Write-Host 'Installed PSScriptAnalyzer versions:'
          Get-Module -Name PSScriptAnalyzer -ListAvailable |
            Sort-Object Version -Descending |
            Select-Object Name, Version, Path |
            Format-Table -AutoSize

      # ──────────────────────────────────────────────────────────────────────
      # Lint
      # ──────────────────────────────────────────────────────────────────────
      - name: Lint
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path -LiteralPath '.\tools\Invoke-Lint.ps1')) {
            throw 'tools\Invoke-Lint.ps1 was not found.'
          }

          & '.\tools\Invoke-Lint.ps1' -Strict

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # ──────────────────────────────────────────────────────────────────────
      # Tests + Coverage
      # ──────────────────────────────────────────────────────────────────────
      - name: Tests
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path -LiteralPath '.\tools\Invoke-Tests.ps1')) {
            throw 'tools\Invoke-Tests.ps1 was not found.'
          }

          & '.\tools\Invoke-Tests.ps1' `
            -Coverage `
            -CoverageTarget 80

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # ──────────────────────────────────────────────────────────────────────
      # Upload test results
      # ──────────────────────────────────────────────────────────────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ps${{ matrix.ps-version }}
          path: output/test-results/TestResults.NUnitXml.xml
          if-no-files-found: warn
          retention-days: 14

      # ──────────────────────────────────────────────────────────────────────
      # Upload coverage
      # ──────────────────────────────────────────────────────────────────────
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ps${{ matrix.ps-version }}
          path: output/coverage/coverage.xml
          if-no-files-found: warn
          retention-days: 14
