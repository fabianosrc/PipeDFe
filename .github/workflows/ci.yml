name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

defaults:
  run:
    shell: pwsh

jobs:
  ci:
    name: CI / PowerShell ${{ matrix.ps-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ps-version: '5.1'
            shell: powershell
          - os: windows-latest
            ps-version: '7'
            shell: pwsh

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── PowerShell 5.1 uses a different shell ───────────────────────────────
      # The matrix.shell value drives only the `shell:` override below.
      # All other steps already default to `pwsh` via the job default above,
      # which is correct for the PS 7 leg. For the PS 5.1 leg we override
      # only the steps that must run under Windows PowerShell.

      # ── Install dependencies ─────────────────────────────────────────────────
      - name: Install Pester
        shell: ${{ matrix.shell }}
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -Name Pester -ListAvailable | Where-Object { $_.Version -ge [version]'5.0.0' })) {
            Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Install PSScriptAnalyzer
        shell: ${{ matrix.shell }}
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -Name PSScriptAnalyzer -ListAvailable)) {
            Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          }

      # ── Lint ─────────────────────────────────────────────────────────────────
      - name: Lint
        shell: ${{ matrix.shell }}
        run: .\tools\Invoke-Lint.ps1 -Strict

      # ── Tests ────────────────────────────────────────────────────────────────
      - name: Tests
        shell: ${{ matrix.shell }}
        run: .\tools\Invoke-Tests.ps1 -Coverage -CoverageTarget 80

      # ── Upload test results ──────────────────────────────────────────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ps${{ matrix.ps-version }}
          path: output/test-results/TestResults.NUnitXml.xml
          if-no-files-found: warn

      # ── Upload coverage report ───────────────────────────────────────────────
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ps${{ matrix.ps-version }}
          path: output/coverage/coverage.xml
          if-no-files-found: warn
