name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci-ps51:
    name: CI / PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Display environment
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"
          Write-Host "Edition           : $($PSVersionTable.PSEdition)"

      - name: Cache modules
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ProgramFiles }}\WindowsPowerShell\Modules
            ${{ env.USERPROFILE }}\Documents\WindowsPowerShell\Modules
          key: psmodules-ps51-${{ hashFiles('**/*.psd1') }}
          restore-keys: psmodules-ps51-

      - name: Install Pester
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -Name Pester -ListAvailable | Where-Object { $_.Version -ge '5.7.1' })) {
            Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Install PSScriptAnalyzer
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -Name PSScriptAnalyzer -ListAvailable | Where-Object { $_.Version -ge '1.24.0' })) {
            Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          }

      - name: Lint
        run: .\tools\Invoke-Lint.ps1 -Strict

      - name: Tests
        run: .\tools\Invoke-Tests.ps1 -Coverage -CoverageTarget 80

      - name: Validate test results
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'output/test-results/TestResults.NUnitXml.xml')) {
            throw 'Test results not found'
          }

      - name: Validate coverage
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'output/coverage/coverage.xml')) {
            throw 'Coverage report not found'
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ps51
          path: output/test-results/TestResults.NUnitXml.xml
          retention-days: 14

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ps51
          path: output/coverage/coverage.xml
          retention-days: 14

  ci-ps7:
    name: CI / PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
